name: Compile Kivy APK - Native Enterprise v12

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Prepare Host Environment & 32-bit Architecture
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev patch ant \
          libc6:i386 libstdc++6:i386 libz1:i386

    - name: Install Buildozer and Toolchain Dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade setuptools cython buildozer

    - name: Run Buildozer Compilation
      env:
        IBM_API_KEY: ${{ secrets.IBM_API_KEY }}
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexus-app-production-apk
        path: bin/*.apk
