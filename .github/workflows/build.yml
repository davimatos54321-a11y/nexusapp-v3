name: Compile Kivy APK with Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix Directory Permissions for Container
        run: |
          # Garante que o contêiner tenha permissão total de escrita no repositório
          git config --global --add safe.directory /__w/nexusapp/nexusapp || true
          chown -R 1000:1000 .

      - name: Compile APK with Buildozer (Dockerized)
        run: |
          # Executa o build de forma isolada e sem erros de sdkmanager
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
