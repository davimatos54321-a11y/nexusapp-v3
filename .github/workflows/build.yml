name: Robust Native Kivy APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-cache \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Python Packaging & Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36 virtualenv

      - name: Clone and Install Python-for-Android (p4a)
        run: |
          git clone https://github.com/kivy/python-for-android.git
          cd python-for-android
          pip install -e .

      - name: Build APK via P4A Native Pipeline
        run: |
          p4a create \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --package=org.nexus.nexusapp \
            --name="NexusApp" \
            --version=0.1 \
            --dest-dir=./bin \
            --android-api=33 \
            --sdk-dir=$ANDROID_SDK_ROOT \
            --ndk-dir=$ANDROID_NDK_HOME \
            --accept-sdk-licenses

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-apk-artifact
          path: bin/*.apk
