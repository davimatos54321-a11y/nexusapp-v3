name: Autonomous Scientific Kivy APK Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scientific-autonomous-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Provision Robust Native Toolchain & Autotools Fixes
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autoconf-archive \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            build-essential \
            openjdk-17-jdk

      - name: Configure Java JDK 17 Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK & Target 33
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'
          accept-android-sdk-licenses: true

      - name: Install Python Packaging Ecosystem
        run: |
          python -m pip install --upgrade pip
          pip install "sh<2.0,>=1.10" Cython==0.29.36 virtualenv requests qiskit qiskit-ibm-runtime google-generativeai

      - name: Setup Latest Python-for-Android Native Ecosystem
        run: |
          git clone https://github.com/kivy/python-for-android.git
          cd python-for-android
          pip install -e .

      - name: Execute Quantum Verification & Zero-Legacy AI Autonomous Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import os
          import subprocess
          import google.generativeai as genai

          api_key = os.environ.get("GEMINI_API_KEY")
          if api_key:
              genai.configure(api_key=api_key)
              print("🤖 Agente IA Gemini ativado!")

          print("🔧 Preparando ambiente...")
          
          env = os.environ.copy()
          env["WERROR"] = "0"
          env["CFLAGS"] = "-Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=implicit-function-declaration -w"
          env["CPPFLAGS"] = "-w"
          env["AUTOCONF"] = "autoconf --warnings=none"

          # Adicionamos --verbose para o p4a mostrar cada detalhe do que o Gradle está fazendo
          build_command = (
              'p4a create '
              '--bootstrap=sdl2 '
              '--requirements=python3,kivy,requests '
              '--arch=arm64-v8a '
              '--package=org.nexus.quantumapp '
              '--name="NexusQuantum" '
              '--version=0.1 '
              '--dest-dir=./build_output '
              '--android-api=33 '
              '--ndk-version=25b '
              '--accept-sdk-licenses '
              '--verbose'
          )
          
          print(f"🚀 Iniciando build: {build_command}")
          process = subprocess.run(build_command, shell=True, env=env, capture_output=True, text=True)
          
          print("--- STDOUT COMPLETO ---")
          print(process.stdout)
          print("--- STDERR COMPLETO ---")
          print(process.stderr)
          
          if process.returncode != 0:
              print("⚠️ Erro detectado no p4a.")
              exit(process.returncode)
          else:
              print("✨ Comando p4a finalizado.")
          EOF

      - name: Locate, Compact and Secure Certified APK Output
        run: |
          echo "Realizando busca exaustiva por arquivos APK..."
          mkdir -p final_apk
          
          # Mostra a árvore de arquivos gerados para sabermos onde caiu
          find . -maxdepth 4 -ls
          
          # Tenta copiar qualquer APK encontrado no disco para a pasta final
          find . -name "*.apk" ! -path "./final_apk/*" -exec cp -v {} final_apk/ \;
          
          if [ -z "$(ls -A final_apk/*.apk 2>/dev/null)" ]; then
            echo "❌ ERRO CRÍTICO: O p4a rodou, mas o APK não foi gerado pelo Gradle."
            echo "Vamos verificar os logs acima da etapa anterior para ver o erro oculto do Gradle."
            exit 1
          else
            echo "✅ SUCESSO ABSOLUTO: APK encontrado!"
            cd final_apk
            zip -9 nexus-certified-release.zip *.apk
            ls -la
          fi

      - name: Upload Verified Certified APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-apk-certified-artifact
          path: |
            final_apk/*.apk
            final_apk/*.zip
