name: Compile Kivy APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            bin/
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('*.py') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev ncurses-dev libssl-dev \
            libffi-dev libsqlite3-dev libbz2-dev

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade "cython<3.0" buildozer pcpp

      - name: Accept Android SDK Licenses & Compile APK
        run: |
          # Remove resquícios anteriores de forma limpa
          rm -rf .buildozer
          
          # Cria a estrutura de diretórios do Android SDK para injetar as licenças preventivamente
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          
          # Aceita automaticamente os termos de licença do SDK do Android
          echo -e "\n24333f8a43b689427183317f3d40600469700558" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

          # Executa o build em modo verboso
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
