class Handler(http.server.SimpleHTTPRequestHandler):

  def log_message(self, format, *args):
    pass  # Silencia os logs no terminal para ficar limpo


with socketserver.TCPServer(("", PORT), Handler) as httpd:
  print(f"Servidor web rodando com sucesso!")
  print(f"Abra o seu navegador e acesse: http://localhost:{PORT}")
  print("Deixe esta tela aberta no Pydroid 3 enquanto usa a página.")
  httpd.serve_forever()
