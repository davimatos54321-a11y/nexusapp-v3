name: Compile Kivy APK - Enterprise Grade

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Clear old corrupted cache with new key
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: buildozer-cache-v2-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-cache-v2-

    - name: Prepare Host Dependencies and 32-bit Architecture Support
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip \
          autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev cmake \
          libffi-dev libssl-dev patch \
          libc6:i386 libstdc++6:i386 libz1:i386

    - name: Install Buildozer Toolchain and Cython
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install "cython<3.1" "buildozer==1.5.0"

    - name: Execute Buildozer Debug Pipeline
      env:
        IBM_API_KEY: ${{ secrets.IBM_API_KEY }}
      run: |
        buildozer -v android debug

    - name: Upload Verified APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexus-app-production-apk
        path: bin/*.apk
