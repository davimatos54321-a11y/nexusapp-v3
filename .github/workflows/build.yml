name: Autonomous Scientific Kivy APK Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  scientific-autonomous-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Provision System Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

      - name: Configure Java JDK 17 Runtime
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK & Target 33
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2'
          accept-android-sdk-licenses: true

      - name: Install Core Packaging Libraries
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.36 virtualenv requests

      - name: Setup Python-for-Android Native Ecosystem
        run: |
          git clone https://github.com/kivy/python-for-android.git
          cd python-for-android
          pip install -e .

      - name: Execute Robust Native Build
        run: |
          p4a create \
            --bootstrap=sdl2 \
            --requirements=python3,kivy \
            --arch=arm64-v8a \
            --package=org.nexus.nexusapp \
            --name=NexusApp \
            --version=0.1 \
            --dest-dir=./bin \
            --android-api=33 \
            --ndk-version=25b \
            --accept-sdk-licenses

      - name: Upload Verified APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-apk-certified-artifact
          path: bin/*.apk
